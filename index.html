<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wisselgeld & Food Pro</title>
    <style>
        :root {
            --bg: #0c0c0c;
            --input-bg: #1e1e1e;
            --accent: #00ff9c;
            --btn-gray: #262626;
            --text: #ffffff;
            --label: #888;
            --danger: #ff4d4d;
        }

        body {
            margin: 0; font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .container { width: 90%; max-width: 400px; padding: 10px; }
        .screen { display: none; }
        .screen.active { display: block; }

        h1 { text-align: center; color: var(--accent); font-size: 20px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .label { font-size: 11px; color: var(--label); margin-bottom: 6px; display: block; text-transform: uppercase; font-weight: 600; }

        /* --- MAIN MENU --- */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .btn-menu { 
            background: var(--btn-gray); color: var(--text); border: 2px solid var(--accent);
            padding: 40px 20px; border-radius: 20px; font-size: 20px; font-weight: 800;
            text-transform: uppercase; cursor: pointer; text-align: center;
        }

        /* --- TIMER SCREEN --- */
        .timer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-food { background: var(--btn-gray); border: 1px solid #444; color: white; padding: 15px 10px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .timer-card { background: var(--input-bg); border-left: 5px solid var(--accent); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .timer-card.finished { border-left-color: var(--danger); animation: flash 1s infinite; }
        @keyframes flash { 50% { opacity: 0.5; } }
        .timer-time { font-size: 20px; font-weight: 800; color: var(--accent); }

        /* --- WISSELGELD CALCULATOR --- */
        .table-display { background: var(--input-bg); padding: 20px; border-radius: 16px; text-align: center; font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .numpad button { padding: 20px; font-size: 24px; background: var(--btn-gray); border-radius: 16px; color: white; }
        .btn-confirm { grid-column: span 3; background: var(--accent) !important; color: black !important; margin-top: 10px; }
        .active-tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .table-card { background: var(--input-bg); border: 1px solid #333; padding: 12px; border-radius: 12px; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back { background: transparent; color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; }

        input { width: 100%; background: var(--input-bg); border: 1px solid #333; border-radius: 14px; padding: 16px; color: #fff; font-size: 18px; outline: none; box-sizing: border-box; }
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-plus { background: var(--accent); color: #000; border-radius: 12px; width: 55px; font-size: 24px; font-weight: bold; }

        .split-box { background: #161616; border: 1px dashed #444; padding: 12px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .split-btn { background: var(--btn-gray); width: 32px; height: 32px; border-radius: 8px; color: white; }

        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .quick-grid button { background: var(--btn-gray); color: #fff; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 10px; border: 1px solid #3d3d3d; }
        
        /* EXACTE VOORRAAD LIJST */
        .stock-container { background: var(--input-bg); padding: 12px; border-radius: 14px; margin-bottom: 15px; }
        .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
        .stock-item:last-child { border-bottom: none; }
        .stock-label { font-size: 14px; font-weight: bold; }
        .stock-controls { display: flex; align-items: center; gap: 10px; }
        .stock-btn { background: var(--btn-gray); color: white; border-radius: 6px; width: 28px; height: 28px; font-size: 16px; font-weight: bold; }
        .stock-count { font-size: 16px; font-weight: bold; width: 30px; text-align: center; color: var(--accent); }

        .btn-main { background: var(--accent); color: #000; width: 100%; padding: 18px; font-weight: 800; border-radius: 16px; font-size: 18px; text-transform: uppercase; }

        .result { margin-top: 20px; background: var(--input-bg); padding: 20px; border-radius: 18px; display: none; border-left: 6px solid var(--accent); }
        .result.show { display: block; }
        .coin-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .coin-item { background: rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 14px; font-size: 16px; display: flex; align-items: center; border: 1px solid #333; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
        .gold { background: #ffd700; } .silver { background: #c0c0c0; } .bronze { background: #cd7f32; }

        button { cursor: pointer; border: none; transition: transform 0.1s; }
        button:active { transform: scale(0.94); }
    </style>
</head>
<body>

<div id="screen-main" class="screen active container">
    <h1>Wisselgeld & Food</h1>
    <div class="menu-grid">
        <button class="btn-menu" onclick="showScreen('screen-timer')">🍳 Food Timer</button>
        <button class="btn-menu" onclick="showScreen('screen-home')">💶 Wisselgeld</button>
    </div>
</div>

<div id="screen-timer" class="screen container">
    <div class="header-row"><button class="btn-back" onclick="showScreen('screen-main')">← Menu</button></div>
    <h1>Food Timer</h1>
    <div class="timer-grid">
        <button class="btn-food" onclick="startTimer('Kipsaté', 7)">Kipsaté (7m)</button>
        <button class="btn-food" onclick="startTimer('Varkenshaas saté', 7)">Varkenshaas saté (7m)</button>
        <button class="btn-food" onclick="startTimer('Sparerib', 7)">Sparerib (7m)</button>
        <button class="btn-food" onclick="startTimer('Schnitzel', 3)">Schnitzel (3m)</button>
        <button class="btn-food" onclick="startTimer('Cordon Bleu', 7)">Cordon Bleu (7m)</button>
        <button class="btn-food" onclick="startTimer('Gamba\'s', 4)">Gamba's (4m)</button>
        <button class="btn-food" onclick="startTimer('Kip aan het spit', 10)">Kip aan spit (10m)</button>
        <button class="btn-food" onclick="startTimer('Varkenshaas med.', 7)">Varkenshaas med. (7m)</button>
    </div>
    <div id="active-timers"></div>
</div>

<div id="screen-home" class="screen container">
    <div class="header-row"><button class="btn-back" onclick="showScreen('screen-main')">← Menu</button></div>
    <h1>Tafel Kiezen</h1>
    <div id="table-display" class="table-display">_</div>
    <div class="numpad">
        <button onclick="pressTable('1')">1</button><button onclick="pressTable('2')">2</button><button onclick="pressTable('3')">3</button>
        <button onclick="pressTable('4')">4</button><button onclick="pressTable('5')">5</button><button onclick="pressTable('6')">6</button>
        <button onclick="pressTable('7')">7</button><button onclick="pressTable('8')">8</button><button onclick="pressTable('9')">9</button>
        <button onclick="pressTable('clear')" style="color:var(--danger)">C</button><button onclick="pressTable('0')">0</button>
        <button onclick="goToCalc()" class="btn-confirm">Verder</button>
    </div>
    <div id="active-tables" class="active-tables-grid"></div>
</div>

<div id="screen-calc" class="screen container">
    <div class="header-row">
        <button class="btn-back" onclick="handleBack()">← Sluit Tafel</button>
        <div id="active-table-badge" class="table-badge" style="background:var(--accent); color:black; padding:4px 10px; border-radius:10px; font-weight:bold; font-size:12px;">Tafel ?</div>
    </div>

    <span class="label">Bedrag rekening (€)</span>
    <div class="input-row"><input type="number" id="bill" placeholder="0,00" inputmode="decimal" oninput="autoSave()"><button class="btn-plus" onclick="saveQuickBill()">+</button></div>
    <div id="savedBills" class="saved-chips" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;"></div>

    <div class="split-box">
        <div style="display:flex; align-items:center; gap:8px;"><button class="split-btn" onclick="updateSplit(-1)">-</button><span id="num-people" style="font-weight:bold">1p</span><button class="split-btn" onclick="updateSplit(1)">+</button></div>
        <div onclick="useSplitAmount()" style="text-align:right"><span class="label" style="margin:0">Per persoon:</span><b id="per-person-display" style="color:var(--accent)">€ 0.00</b></div>
    </div>

    <span class="label">Betaald (€)</span>
    <input type="number" id="paid" placeholder="0,00" inputmode="decimal" style="margin-bottom:12px">
    <div class="quick-grid" id="quickButtons"></div>

    <span class="label">Afronden naar?</span>
    <input type="number" id="target" placeholder="bv. 50,00" inputmode="decimal" style="margin-bottom:15px" oninput="autoSave()">

    <span class="label">Aantal Munten in Portemonnee</span>
    <div class="stock-container" id="stock-list"></div>

    <button class="btn-main" onclick="calculate()">Bereken</button>
    <div id="result" class="result"></div>
</div>

<script>
    let runningTimers = [];
    let currentTable = "";
    let splitCount = 1;
    let activeOrders = JSON.parse(localStorage.getItem('active_orders_v9') || '{}');
    let quickBills = JSON.parse(localStorage.getItem('quick_bills_v9') || '[]');
    
    // STANDAARD VOORRAAD (Briefjes staan op 99 = oneindig voor het gemak, munten kun je zelf instellen)
    let coinStock = JSON.parse(localStorage.getItem('coin_quantities') || '{"5000":99,"2000":99,"1000":99,"500":99,"200":5,"100":5,"50":10,"20":10,"10":10,"5":5}');
    
    const denoms = [5000, 2000, 1000, 500, 200, 100, 50, 20, 10, 5];
    const labels = ['50€', '20€', '10€', '5€', '2€', '1€', '50c', '20c', '10c', '5c'];
    const fullLabels = ['50 euro', '20 euro', '10 euro', '5 euro', '2 euro', '1 euro', '50 cent', '20 cent', '10 cent', '5 cent'];

    function renderStockList() {
        const cont = document.getElementById('stock-list');
        cont.innerHTML = "";
        // We laten alleen briefgeld van 5€ en alle munten zien om het scherm overzichtelijk te houden
        denoms.forEach((d, i) => {
            if (d <= 500) { 
                const item = document.createElement('div');
                item.className = "stock-item";
                item.innerHTML = `
                    <span class="stock-label">${labels[i]}</span>
                    <div class="stock-controls">
                        <button class="stock-btn" onclick="changeStock(${d}, -1)">-</button>
                        <span class="stock-count" id="stock-count-${d}">${coinStock[d]}</span>
                        <button class="stock-btn" onclick="changeStock(${d}, 1)">+</button>
                    </div>
                `;
                cont.appendChild(item);
            }
        });
    }

    function changeStock(d, val) {
        coinStock[d] = Math.max(0, coinStock[d] + val);
        localStorage.setItem('coin_quantities', JSON.stringify(coinStock));
        document.getElementById(`stock-count-${d}`).innerText = coinStock[d];
        vibrate(10);
    }

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id === 'screen-home') renderActiveTables(); }
    function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    // TIMERS
    function startTimer(dish, mins) { vibrate(20); runningTimers.push({ id: Date.now(), dish, endTime: Date.now() + (mins * 60 * 1000), finished: false }); updateTimerUI(); }
    function updateTimerUI() {
        const cont = document.getElementById('active-timers'); cont.innerHTML = ""; const now = Date.now();
        runningTimers.forEach(t => {
            const left = Math.max(0, Math.floor((t.endTime - now) / 1000));
            if (left === 0 && !t.finished) { t.finished = true; vibrate([500, 200, 500, 200, 500]); }
            const card = document.createElement('div'); card.className = `timer-card ${left === 0 ? 'finished' : ''}`;
            card.innerHTML = `<div><b>${t.dish}</b><div class="timer-time">${Math.floor(left/60)}:${(left%60).toString().padStart(2,'0')}</div></div><button onclick="removeTimer(${t.id})" style="background:var(--danger); color:white; padding:10px; border-radius:10px">OK</button>`;
            cont.appendChild(card);
        });
    }
    function removeTimer(id) { runningTimers = runningTimers.filter(t => t.id !== id); updateTimerUI(); }
    setInterval(updateTimerUI, 1000);

    // WISSELGELD
    function pressTable(num) { vibrate(10); if (num === 'clear') currentTable = ""; else if (currentTable.length < 3) currentTable += num; document.getElementById('table-display').innerText = currentTable || "_"; }
    function goToCalc(t = null) { 
        if (t) currentTable = t; if (!currentTable) return; vibrate(20);
        const data = activeOrders[currentTable] || {bill: "", target: "", split: 1};
        document.getElementById('active-table-badge').innerText = "Tafel " + currentTable;
        document.getElementById('bill').value = data.bill; document.getElementById('target').value = data.target;
        splitCount = data.split || 1; updateSplit(0); document.getElementById('paid').value = "";
        document.getElementById('result').classList.remove('show'); showScreen('screen-calc'); 
    }
    function renderActiveTables() {
        const cont = document.getElementById('active-tables'); cont.innerHTML = "";
        Object.keys(activeOrders).forEach(t => {
            const card = document.createElement('div'); card.className = "table-card"; card.style.marginBottom="10px";
            card.innerHTML = `<b style="color:var(--accent)">Tafel ${t}</b><div style="font-size:12px">€ ${activeOrders[t].bill}</div>`;
            card.onclick = () => goToCalc(t); cont.appendChild(card);
        });
    }
    function updateSplit(v) { splitCount = Math.max(1, splitCount + v); document.getElementById('num-people').innerText = splitCount + "p"; document.getElementById('per-person-display').innerText = "€ " + ((parseFloat(document.getElementById('bill').value)||0)/splitCount).toFixed(2); autoSave(); }
    function useSplitAmount() { document.getElementById('bill').value = ((parseFloat(document.getElementById('bill').value)||0)/splitCount).toFixed(2); splitCount = 1; updateSplit(0); }
    function autoSave() { const b = document.getElementById('bill').value, t = document.getElementById('target').value; if(b || t) activeOrders[currentTable] = {bill:b, target:t, split:splitCount}; else delete activeOrders[currentTable]; localStorage.setItem('active_orders_v9', JSON.stringify(activeOrders)); }
    function handleBack() { if(confirm("Tafel verwijderen?")) { delete activeOrders[currentTable]; localStorage.setItem('active_orders_v9', JSON.stringify(activeOrders)); } showScreen('screen-home'); }
    function saveQuickBill() { const v = document.getElementById('bill').value; if(v && !quickBills.includes(v)) { quickBills.push(parseFloat(v).toFixed(2)); localStorage.setItem('quick_bills_v9', JSON.stringify(quickBills)); renderQuick(); vibrate(30); } }
    function renderQuick() {
        const cont = document.getElementById('savedBills'); cont.innerHTML = '';
        quickBills.forEach((amt, i) => {
            const c = document.createElement('div'); c.style.background="#333"; c.style.padding="6px 10px"; c.style.borderRadius="8px"; c.style.fontSize="12px";
            c.innerText = '€' + amt; c.onclick = () => { document.getElementById('bill').value = amt; updateSplit(0); vibrate(10); };
            c.oncontextmenu = (e) => { e.preventDefault(); if(confirm('Wissen?')) { quickBills.splice(i,1); localStorage.setItem('quick_bills_v9', JSON.stringify(quickBills)); renderQuick(); } };
            cont.appendChild(c);
        });
    }

    function calculate() {
        const bill = parseFloat(document.getElementById('bill').value) || 0, paid = parseFloat(document.getElementById('paid').value) || 0, target = parseFloat(document.getElementById('target').value);
        const resDiv = document.getElementById('result');
        if (paid < bill && isNaN(target)) { vibrate([50,50]); return; }
        vibrate(20);
        
        let diff = !isNaN(target) ? Math.round((paid - target) * 100) : Math.round((paid - bill) * 100);
        let rounded = Math.round(diff / 5) * 5;
        let html = `<div style="font-size:32px; font-weight:800; color:var(--accent)">€${(rounded/100).toFixed(2)}</div><div class="coin-list">`;
        
        // Maak een tijdelijke kopie van de voorraad om mee te rekenen
        let virtualStock = {...coinStock};
        let temp = rounded;

        for (let i = 0; i < denoms.length; i++) {
            const d = denoms[i];
            let requiredCount = Math.floor(temp / d);
            
            if (requiredCount > 0) {
                // Kijk hoeveel we er écht van hebben liggen
                let actualUsed = Math.min(requiredCount, virtualStock[d]);
                
                if (actualUsed > 0) {
                    let cl = d >= 500 ? 'silver' : (d >= 100 ? 'gold' : 'bronze');
                    html += `<div class="coin-item"><span class="dot ${cl}"></span><b>${actualUsed}x</b>&nbsp;${fullLabels[i]}</div>`;
                    temp -= actualUsed * d;
                    virtualStock[d] -= actualUsed; // Trek ze virtueel af
                }
            }
        }

        // Als er na de berekening nog restbedrag is omdat de grote munten op waren
        if (temp > 0) {
            html += `<div style="color:var(--danger); font-size:12px; margin-top:10px; width:100%;">⚠️ Let op: Te weinig kleine munten in voorraad voor exacte match!</div>`;
        }

        if(!isNaN(target)) html += `</div><div style="margin-top:15px; font-size:14px; color:#ffd166; font-weight:bold;">Fooi: €${((target-bill)).toFixed(2)}</div>`;
        else html += "</div>";
        
        resDiv.innerHTML = html; resDiv.className = "result show";
    }

    [10, 20, 50, 100, 200].forEach(v => {
        const b = document.createElement('button'); b.innerText = '€' + v;
        b.onclick = () => { vibrate(10); document.getElementById('paid').value = v.toFixed(2); calculate(); };
        document.getElementById('quickButtons').appendChild(b);
    });
    renderQuick(); renderStockList();
</script>
</body>
</html>
